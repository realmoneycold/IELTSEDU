services:
  - type: web
    name: ieltspractice-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main

    buildCommand: "npm ci && npx prisma generate && npx prisma migrate deploy || npx prisma db push --accept-data-loss"
    startCommand: "node src/server.js"

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: JWT_SECRET
        generateValue: false
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: EMAIL_FROM
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false
